syntax = "proto3";

package meadow.daemon.v1;

option csharp_namespace = "Meadow.Daemon.Contracts.V1";

// ─── Ping ────────────────────────────────────────────────────────────────────

message PingRequest {}

message PongResponse {
  DaemonVersion version = 1;
  int64 timestamp_ms     = 2;
}

// ─── Version ─────────────────────────────────────────────────────────────────

message DaemonVersion {
  string version          = 1; // semver e.g. "1.1.0"
  int32  protocol_version = 2; // incremented only on breaking changes
  string git_commit       = 3; // short SHA for diagnostics
}

// ─── Device Info ─────────────────────────────────────────────────────────────

message DeviceInfo {
  string hostname      = 1;
  string architecture  = 2; // "arm64"
  string os_version    = 3; // "Debian 12 (bookworm)"
  string dotnet_version = 4;
  int64  uptime_seconds = 5;
  string machine_id    = 6; // /etc/machine-id
  DaemonVersion daemon_version = 7;
}

// ─── Health ──────────────────────────────────────────────────────────────────

enum HealthState {
  HEALTH_STATE_UNSPECIFIED = 0;
  HEALTHY                  = 1;
  DEGRADED                 = 2;
  UNHEALTHY                = 3;
}

message HealthStatus {
  HealthState state       = 1;
  DaemonVersion daemon_version = 2;
  int64  uptime_seconds   = 3;
  int64  memory_bytes     = 4;
  int32  disk_free_mb     = 5;
  repeated AppHealthItem apps = 6;
  int64  timestamp_ms     = 7;
}

message AppHealthItem {
  string app_name  = 1;
  string state     = 2; // AppState as string
  int32  pid       = 3; // 0 if not running
}

// ─── vsdbg Info ──────────────────────────────────────────────────────────────

message VsdbgInfo {
  bool   installed       = 1;
  string version         = 2; // empty if not installed
  string install_path    = 3;
}

// ─── Log Events ──────────────────────────────────────────────────────────────

enum LogLevel {
  LOG_LEVEL_UNSPECIFIED = 0;
  LOG_LEVEL_TRACE       = 1;
  LOG_LEVEL_DEBUG       = 2;
  LOG_LEVEL_INFO        = 3;
  LOG_LEVEL_WARN        = 4;
  LOG_LEVEL_ERROR       = 5;
  LOG_LEVEL_FATAL       = 6;
}

message LogEvent {
  LogLevel level          = 1;
  string   message        = 2;
  string   source_context = 3;
  string   exception      = 4;
  int64    timestamp_ms   = 5;
  map<string, string> properties = 6;
}

message StreamLogsRequest {
  LogLevel minimum_level = 1; // default: INFORMATION
  string   filter_category = 2;
}

message StreamHealthRequest {}

message GetDeviceInfoResponse {
  DeviceInfo info = 1;
}
