syntax = "proto3";

package meadow.daemon.v1;

option csharp_namespace = "Meadow.Daemon.Contracts.V1";

// ─── App State ───────────────────────────────────────────────────────────────

enum AppState {
  APP_STATE_UNSPECIFIED = 0;
  STARTING              = 1;
  RUNNING               = 2;
  STOPPING              = 3;
  STOPPED               = 4;
  FAILED                = 5;
}

// ─── Application Status ──────────────────────────────────────────────────────

message ApplicationStatus {
  string   app_name          = 1;
  AppState state             = 2;
  int32    pid               = 3;  // 0 if not running
  int64    started_at_ms     = 4;  // 0 if not running
  int32    last_exit_code    = 5;
  string   last_exit_reason  = 6;  // "exited", "killed", "crashed"
  string   active_version    = 7;  // current active production label
  bool     auto_start        = 8;
}

// ─── Output Streaming ────────────────────────────────────────────────────────

enum OutputStream {
  OUTPUT_STREAM_UNSPECIFIED = 0;
  STDOUT                    = 1;
  STDERR                    = 2;
}

message OutputLine {
  OutputStream stream  = 1;
  string       text    = 2;
  int64        timestamp_ms = 3;
}

// ─── Start Application ───────────────────────────────────────────────────────

message StartApplicationRequest {
  string app_name      = 1;
  bool   use_debug_slot = 2; // run from debug/ dir instead of active symlink
}

message StartApplicationResponse {
  bool   success       = 1;
  int32  pid           = 2;
  string error_message = 3;
}

// ─── Stop Application ────────────────────────────────────────────────────────

message StopApplicationRequest {
  string app_name            = 1;
  int32  grace_period_seconds = 2; // 0 = use daemon default
}

message StopApplicationResponse {
  bool   success       = 1;
  int32  exit_code     = 2;
  string error_message = 3;
}

// ─── Restart Application ─────────────────────────────────────────────────────

message RestartApplicationRequest {
  string app_name       = 1;
  bool   use_debug_slot = 2;
}

message RestartApplicationResponse {
  bool   success       = 1;
  int32  new_pid       = 2;
  string error_message = 3;
}

// ─── Get Status ──────────────────────────────────────────────────────────────

message GetApplicationStatusRequest {
  string app_name = 1;
}

message GetApplicationStatusResponse {
  bool               found  = 1;
  ApplicationStatus  status = 2;
}

// ─── List Processes ──────────────────────────────────────────────────────────

message ListProcessesRequest {}

message ListProcessesResponse {
  repeated ApplicationStatus apps = 1;
}

// ─── Stream Output ───────────────────────────────────────────────────────────

message StreamOutputRequest {
  string app_name = 1;
}
