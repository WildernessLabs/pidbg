syntax = "proto3";

package meadow.daemon.v1;

option csharp_namespace = "Meadow.Daemon.Contracts.V1";

// ─── App State ───────────────────────────────────────────────────────────────

enum AppState {
  APP_STATE_UNSPECIFIED = 0;
  APP_STATE_STARTING    = 1;
  APP_STATE_RUNNING     = 2;
  APP_STATE_STOPPING    = 3;
  APP_STATE_STOPPED     = 4;
  APP_STATE_FAILED      = 5;
}

// ─── Application Status ──────────────────────────────────────────────────────

message ApplicationStatus {
  string   app_name          = 1;
  AppState state             = 2;
  int32    pid               = 3;  // 0 if not running
  int64    started_at_ms     = 4;  // 0 if not running
  int32    last_exit_code    = 5;
  string   last_exit_reason  = 6;  // "exited", "killed", "crashed"
  string   active_version    = 7;  // current active production label
  bool     auto_start        = 8;
}

// ─── Output Streaming ────────────────────────────────────────────────────────

enum OutputStream {
  OUTPUT_STREAM_UNSPECIFIED = 0;
  STDOUT                    = 1;
  STDERR                    = 2;
  COMBINED                  = 3;
}

message OutputLine {
  OutputStream stream  = 1;
  string       text    = 2;
  int64        timestamp_ms = 3;
}

// ─── Start Process ───────────────────────────────────────────────────────────

message StartProcessRequest {
  string app_name      = 1;
  bool   use_debug_slot = 2; // run from debug/ dir instead of active symlink
}

message StartProcessResponse {
  bool   success       = 1;
  int32  pid           = 2;
  string error_message = 3;
}

// ─── Stop Process ────────────────────────────────────────────────────────────

message StopProcessRequest {
  string app_name            = 1;
  int32  grace_period_seconds = 2; // 0 = use daemon default
}

message StopProcessResponse {
  bool   success       = 1;
  int32  exit_code     = 2;
  string error_message = 3;
}

// ─── Restart Process ─────────────────────────────────────────────────────────

message RestartProcessRequest {
  string app_name       = 1;
  bool   use_debug_slot = 2;
}

message RestartProcessResponse {
  bool   success       = 1;
  int32  new_pid       = 2;
  string error_message = 3;
}

// ─── Get Status ──────────────────────────────────────────────────────────────

message GetProcessStatusRequest {
  string app_name = 1;
}

message GetProcessStatusResponse {
  bool               found  = 1;
  ApplicationStatus  status = 2;
}

// ─── List Processes ──────────────────────────────────────────────────────────

message ListProcessesRequest {}

message ListProcessesResponse {
  repeated ApplicationStatus apps = 1;
}

// ─── Stream Output ───────────────────────────────────────────────────────────

message StreamOutputRequest {
  string app_name = 1;
  OutputStream stream = 2;
}
